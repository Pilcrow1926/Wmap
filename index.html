<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wmap</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0d0c; min-height: 100vh; }
</style>
<style>
  #pw-root {
    --bg-outer: #1c1b1a;
    --bg-panel: #26241f;
    --grout: #0e0d0c;
    --ink: #f2ede2;
    --ink-dim: #9a9488;
    --accent: #ff5a1f;
    --accent-dim: #7a3417;

    position: relative;
    font-family: 'Courier New', Courier, monospace;
    color: var(--ink);
    background: var(--bg-outer);
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 6px 6px;
    padding: clamp(14px, 4vw, 28px) clamp(12px, 4vw, 20px) 20px;
    border-radius: 4px;
    max-width: 100%;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }
  #pw-root * { box-sizing: border-box; }

  .pw-nickname-btn {
    background: var(--bg-panel); border: 1px solid var(--accent-dim); color: var(--ink-dim);
    font-family: inherit; font-size: 11px; padding: 5px 9px; border-radius: 2px; cursor: pointer;
  }
  .pw-nickname-btn:hover { color: var(--accent); border-color: var(--accent); }
  .pw-nickname-edit { display: flex; align-items: center; gap: 4px; }
  .pw-nickname-edit input {
    width: 110px; background: var(--bg-outer); border: 1px solid var(--accent-dim); color: var(--ink);
    font-family: inherit; font-size: 11px; padding: 5px 6px; border-radius: 2px;
  }
  .pw-nickname-edit button {
    background: var(--accent); border: none; color: #1a1207; font-family: inherit;
    font-size: 11px; padding: 5px 8px; border-radius: 2px; cursor: pointer; font-weight: 700;
  }

  .pw-toggle-group { display: flex; gap: 4px; background: var(--bg-panel); padding: 3px; border-radius: 3px; }

  .pw-icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 26px;
    background: none; border: none; border-radius: 2px;
    color: var(--ink-dim); cursor: pointer;
  }
  .pw-icon-btn.pw-active { background: var(--accent); color: #1a1207; }
  .pw-icon-btn:hover:not(.pw-active) { color: var(--ink); }

  .pw-wall-frame {
    background: var(--grout);
    padding: 6px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    width: 100%;
    margin: 0 auto;
    position: relative;
  }
  #pw-canvas {
    image-rendering: pixelated;
    cursor: crosshair;
    display: block;
    background: #000000;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---- glassmorphism HUD elements floating on top of the map ---- */
  .pw-hud {
    position: absolute;
    background: rgba(20,19,17,0.5);
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 9px;
    color: var(--ink-dim);
    z-index: 14;
  }
  .pw-hud-coord {
    top: 12px; left: 12px;
    padding: 6px 10px;
    font-size: 10.5px;
    color: var(--ink);
    display: flex; align-items: center; gap: 7px;
    pointer-events: none;
    white-space: nowrap;
  }
  .pw-sync-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #3ecf6e;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.3);
    flex: none;
    transition: background 0.2s ease;
  }
  .pw-sync-dot.pw-sync-syncing { background: #ffb020; animation: pw-sync-pulse 1s ease-in-out infinite; }
  .pw-sync-dot.pw-sync-error { background: #ff4d4f; }
  @keyframes pw-sync-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .pw-hud-fit {
    top: 12px; right: 12px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .pw-hud-fit:hover { color: var(--accent); border-color: rgba(255,90,31,0.5); }
  .pw-hud-timelapse {
    top: 12px; right: 52px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .pw-hud-timelapse:hover { color: var(--accent); border-color: rgba(255,90,31,0.5); }
  .pw-hud-info {
    top: 12px; right: 92px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .pw-hud-info:hover { color: var(--accent); border-color: rgba(255,90,31,0.5); }

  .pw-timelapse-modal {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,9,8,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 50;
    padding: 16px;
  }
  .pw-timelapse-modal.pw-modal-hidden { display: none; }
  .pw-timelapse-card {
    width: min(480px, 100%);
    background: rgba(28,27,25,0.85);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    padding: 16px;
    color: var(--ink);
    font-family: inherit;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  .pw-timelapse-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .pw-timelapse-title { font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px; }
  .pw-timelapse-close { background: none; border: none; color: var(--ink-dim); font-size: 18px; cursor: pointer; padding: 4px; }
  .pw-timelapse-close:hover { color: var(--accent); }
  .pw-timelapse-empty { font-size: 12px; color: var(--ink-dim); padding: 30px 10px; text-align: center; }
  .pw-timelapse-canvas-wrap { background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  #pw-timelapse-canvas { width: 100%; height: auto; display: block; background: #fff; image-rendering: pixelated; }
  .pw-timelapse-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pw-timelapse-controls input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  .pw-timelapse-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: var(--ink);
    font-family: inherit; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .pw-timelapse-btn:hover { border-color: var(--accent); color: var(--accent); }
  .pw-timelapse-speed {
    background: rgba(14,13,12,0.6); border: 1px solid rgba(255,255,255,0.18); color: var(--ink);
    font-family: inherit; font-size: 11px; padding: 5px 6px; border-radius: 6px;
  }
  .pw-timelapse-meta { font-size: 10.5px; color: var(--ink-dim); margin-top: 8px; }

  .pw-float-fab {
    position: absolute;
    left: 14px; bottom: 14px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(20,19,17,0.68);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 17;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }
  .pw-float-fab:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.55); }
  .pw-float-fab.pw-fab-active { box-shadow: 0 0 0 2px var(--accent), 0 8px 22px rgba(0,0,0,0.45); }
  .pw-float-fab-swatch { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.6); }

  .pw-float-panel {
    position: absolute;
    left: 14px; bottom: 68px;
    max-width: min(280px, calc(100% - 28px));
    background: rgba(24,23,21,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 12px;
    z-index: 15;
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .pw-float-panel.pw-panel-hidden { opacity: 0; transform: translateY(8px) scale(0.97); pointer-events: none; }
  .pw-float-panel-inner { display: flex; flex-direction: column; gap: 10px; }
  .pw-float-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pw-glass-toggle { background: rgba(255,255,255,0.08); }
  .pw-brush-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pw-size-stepper {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.08); border-radius: 6px; padding: 3px 4px;
  }
  .pw-size-btn {
    width: 20px; height: 20px; border-radius: 4px;
    background: none; border: none; color: var(--ink-dim);
    font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-size-btn:hover { background: rgba(255,255,255,0.12); color: var(--ink); }
  #pw-size-value { font-size: 10.5px; color: var(--ink-dim); min-width: 30px; text-align: center; }

  .pw-palette-block { display: flex; flex-direction: column; gap: 4px; }
  .pw-palette-label { font-size: 10px; color: var(--ink-dim); letter-spacing: 0.05em; padding-left: 2px; }
  .pw-palette { display: flex; gap: 5px; background: rgba(255,255,255,0.06); padding: 6px; border-radius: 8px; flex-wrap: wrap; max-width: 256px; }
  .pw-swatch { width: 20px; height: 20px; border-radius: 5px; border: 2px solid transparent; cursor: pointer; padding: 0; flex: none; }
  .pw-swatch.pw-selected { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(255,255,255,0.3); }
  .pw-add-swatch {
    background: transparent !important;
    border: 1.5px dashed var(--ink-dim) !important;
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-add-swatch:hover { color: var(--accent); border-color: var(--accent) !important; }

  .pw-custom { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; }
  .pw-glass-custom { background: rgba(255,255,255,0.06); }
  .pw-custom input[type="color"] { width: 22px; height: 22px; border: none; border-radius: 5px; padding: 0; background: none; cursor: pointer; }
  .pw-custom input[type="text"] { width: 68px; background: rgba(14,13,12,0.6); border: 1px solid rgba(255,255,255,0.16); color: var(--ink); font-family: inherit; font-size: 11px; padding: 4px 6px; border-radius: 5px; text-transform: lowercase; }

  .pw-info-content { display: flex; flex-direction: column; gap: 16px; }
  .pw-info-section-title { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; }
  .pw-info-row { font-size: 12px; color: var(--ink); padding: 2px 0; }

  .pw-footer { margin-top: 12px; font-size: 11px; color: var(--ink-dim); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pw-footer-left { display: flex; align-items: center; gap: 8px; }
  .pw-vote-block { display: flex; align-items: center; gap: 8px; }
  .pw-vote-status { font-size: 10.5px; color: var(--ink-dim); white-space: nowrap; }
  .pw-vote-buttons { display: flex; gap: 5px; }
  .pw-vote-btn {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-panel); cursor: pointer; padding: 0;
  }
  .pw-vote-yes { border: 1.5px solid #3ecf6e; color: #3ecf6e; }
  .pw-vote-yes.pw-active { background: #3ecf6e; color: #0d2415; }
  .pw-vote-no { border: 1.5px solid #ff4d4f; color: #ff4d4f; }
  .pw-vote-no.pw-active { background: #ff4d4f; color: #2a0a0a; }
  .pw-vote-neutral { border: 1.5px solid var(--ink-dim); color: var(--ink-dim); }
  .pw-vote-neutral.pw-active { background: var(--ink-dim); color: #1a1a1f; }

  .pw-loading { font-size: 12px; color: var(--ink-dim); padding: 40px 0; text-align: center; }

  .pw-popup {
    position: absolute;
    background: var(--bg-panel);
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 11px;
    color: var(--ink);
    width: 210px;
    z-index: 30;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45);
  }
  .pw-popup-close {
    position: absolute; top: 4px; right: 6px;
    background: none; border: none; color: var(--ink-dim);
    font-size: 14px; line-height: 1; cursor: pointer; padding: 2px;
  }
  .pw-popup-close:hover { color: var(--accent); }
  .pw-popup-title { font-weight: 700; letter-spacing: 0.03em; margin-bottom: 6px; padding-right: 14px; }
  .pw-popup-row { padding: 2px 0; }
  .pw-popup-dim { color: var(--ink-dim); }
  .pw-popup-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 6px 0; }
  .pw-popup-rename { display: flex; gap: 4px; margin-bottom: 4px; }
  .pw-popup-rename input {
    flex: 1; min-width: 0; background: var(--bg-outer); border: 1px solid var(--accent-dim); color: var(--ink);
    font-family: inherit; font-size: 11px; padding: 4px 6px; border-radius: 2px;
  }
  .pw-popup-rename button {
    background: var(--accent); border: none; color: #1a1207; font-family: inherit;
    font-size: 11px; padding: 4px 8px; border-radius: 2px; cursor: pointer; font-weight: 700;
  }

  @media (max-width: 420px) {
    .pw-palette { max-width: 100%; }
    .pw-float-panel { left: 8px; right: 8px; bottom: 8px; max-width: none; }
  }
</style>
</head>
<body>
<div id="pw-root"></div>
<script type="module">

  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://ezjiklirbxtwwrpycaiz.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6amlrbGlyYnh0d3dycHljYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NTM0MTYsImV4cCI6MjEwMTIyOTQxNn0.Ieuz3kHP5-pj8R8za_c3r16gUACSis3KcM5cWtipB7Q'
  );

  let anonId = localStorage.getItem('wmap-anon-id');
  if (!anonId) {
    anonId = crypto.randomUUID();
    localStorage.setItem('wmap-anon-id', anonId);
  }

  window.storage = {
    async get(key, shared) {
      const owner = shared ? 'shared' : anonId;
      const { data, error } = await supabase
        .from('kv_store').select('value')
        .eq('key', key).eq('owner', owner).maybeSingle();
      if (error) throw error;
      if (!data) throw new Error('not found');
      return { key, value: data.value, shared };
    },
    async set(key, value, shared) {
      const owner = shared ? 'shared' : anonId;
      const { error } = await supabase.from('kv_store')
        .upsert({ key, owner, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value, shared };
    },
    async delete(key, shared) {
      const owner = shared ? 'shared' : anonId;
      const { error } = await supabase.from('kv_store')
        .delete().eq('key', key).eq('owner', owner);
      if (error) throw error;
      return { key, deleted: true, shared };
    },
    async list(prefix, shared) {
      const owner = shared ? 'shared' : anonId;
      let q = supabase.from('kv_store').select('key').eq('owner', owner);
      if (prefix) q = q.like('key', prefix + '%');
      const { data, error } = await q;
      if (error) throw error;
      return { keys: (data || []).map(r => r.key), prefix, shared };
    }
  };

  window.wmapLog = async function (entries) {
    if (!entries || entries.length === 0) return;
    const rows = entries.map(e => ({ x: e.x, y: e.y, color: e.color, author: e.author || null }));
    const { error } = await supabase.from('pixel_log').insert(rows);
    if (error) throw error;
  };

  window.wmapFetchLog = async function (maxEvents) {
    const limit = maxEvents || 20000;
    const pageSize = 1000;
    let all = [];
    let from = 0;
    while (all.length < limit) {
      const to = from + pageSize - 1;
      const { data, error } = await supabase
        .from('pixel_log')
        .select('x,y,color,author,created_at')
        .order('created_at', { ascending: true })
        .range(from, to);
      if (error) throw error;
      if (!data || data.length === 0) break;
      all = all.concat(data);
      if (data.length < pageSize) break;
      from += pageSize;
    }
    return all.slice(0, limit);
  };


(function () {
  const ROOT = document.getElementById('pw-root');
  const CHUNK = 16;
  const SUPERCHUNK = 16;
  const BG_COLOR = 'ffffff';
  const MAX_ZOOM = 32;
  const PIXEL_LINE_ZOOM_THRESHOLD = 8;
  const CHUNK_LINE_ZOOM_THRESHOLD = 1.2;
  const CHUNK_NAME_ZOOM_MIN_PX = 40; // min on-screen chunk size before showing its name label

  const PALETTE = [
    'ffffff','1a1a1f','6b6b70',
    'e63946','f4a300','ffd60a','8ac926',
    '2a9d8f','06aed5','4d7cfe','6a4c93',
    'd90368','ff8fab','7f4f24','c9a66b',
    '3a0ca3','ff5a1f'
  ];

  const CHUNKS = 128;
  const TOTAL = CHUNKS * CHUNK;
  let viewportW = 640, viewportH = 640; // canvas's actual internal resolution — rectangular, not forced square
  let minZoom = Math.min(viewportW, viewportH) / TOTAL;
  let zoom = minZoom;
  let rawZoom = minZoom; // continuous accumulator; zoom itself is snapped from this
  let originX = 0, originY = 0;

  let chunkData = new Map();      // "cx_cy" -> { c: 1536-char color string, a: 256-length author array }
  let chunkVersions = {};         // "cx_cy" -> timestamp applied
  let pendingEdits = new Map();   // "cx_cy" -> Map(localIdx -> {color, author})
  let indexCache = {};            // "cx_cy" -> timestamp
  let chunkNames = {};            // "cx_cy" -> name string
  let savedColors = [];
  let myName = 'Guest';
  let voteState = { startedAt: 0, votes: {} };
  const VOTE_WINDOW_MS = 12 * 60 * 60 * 1000;

  let selectedColor = 'e63946';
  let mode = 'click';
  let panelOpen = false;
  let brushRadius = 0;      // 0 = single pixel; radius in world-pixels around the cursor
  let brushShape = 'square'; // 'square' | 'circle'
  let stampOffsetsCache = new Map();
  let timelapseEvents = [];
  let timelapseIndex = 0;
  let timelapsePlaying = false;
  let timelapseSpeed = 40;
  let timelapseGrid = null;
  let timelapseCanvas = null, timelapseCtx = null;
  let timelapseAnimHandle = null;
  let isPointerDown = false, isPanning = false;
  let panLast = null, lastPaintedWorld = null;
  let drawScheduled = false;
  let pollTimer = null;

  let touchMode = null;
  let touchStartDist = 0, touchStartZoom = 1, touchStartRawZoom = 1, touchStartMid = null, touchStartOrigin = null;

  let canvas, ctx, coordEl, syncDotEl;

  ROOT.innerHTML = '<div class="pw-loading">벽을 불러오는 중…</div>';

  function chunkIndexKey() { return `chunk-index:${CHUNKS}`; }
  function chunkNamesKey() { return `chunk-names:${CHUNKS}`; }
  function chunkKey(cx, cy) { return `chunk:${CHUNKS}:${cx}_${cy}`; }
  function resetVoteKey() { return `reset-vote:${CHUNKS}`; }
  function defaultChunkObj() { return { c: BG_COLOR.repeat(CHUNK * CHUNK), a: new Array(CHUNK * CHUNK).fill(null) }; }
  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
  function quantizeZoom(z) {
    // below 1x (overview) stays continuous; at/above 1x snap to whole-number ratios
    // so every world pixel maps to an exact integer number of screen pixels
    if (z <= 1) return z;
    return Math.max(1, Math.round(z));
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function tryParseChunk(str) {
    try {
      const obj = JSON.parse(str);
      if (obj && typeof obj.c === 'string' && obj.c.length === CHUNK * CHUNK * 6 && Array.isArray(obj.a) && obj.a.length === CHUNK * CHUNK) return obj;
    } catch (e) { /* ignore */ }
    return null;
  }

  async function getJSON(key, shared, fallback) {
    try {
      const result = await window.storage.get(key, shared);
      if (!result || !result.value) return fallback;
      return JSON.parse(result.value);
    } catch (e) { return fallback; }
  }

  async function loadOrCreateNickname() {
    try {
      const result = await window.storage.get('nickname', false);
      if (result && result.value) { myName = result.value; return; }
    } catch (e) { /* not set yet */ }
    myName = `Guest${Math.floor(1000 + Math.random() * 9000)}`;
    try { await window.storage.set('nickname', myName, false); } catch (e) { /* ignore */ }
  }
  async function setNickname(newName) {
    newName = newName.trim().slice(0, 20);
    if (!newName) return;
    myName = newName;
    try { await window.storage.set('nickname', myName, false); } catch (e) { /* ignore */ }
  }

  function renderNicknameControl() {

  // sizes the square map box to whichever is smaller — available width or
  // available height — so the whole map always fits without scrolling.
  // Available height is measured from the real leftover space (window height
  // minus the header/hint/footer that actually render around it), not a
  // rough guess, so on wide/landscape screens the map uses as much room as
  // it actually has instead of shrinking more than necessary.
  function fitWallFrameToViewport() {
    const frame = document.querySelector('.pw-wall-frame');
    if (!frame || !frame.parentElement) return;
    frame.style.width = '';
    frame.style.height = '';
    const root = frame.parentElement;
    const rootStyle = getComputedStyle(root);
    const parentWidth = root.clientWidth - parseFloat(rootStyle.paddingLeft || 0) - parseFloat(rootStyle.paddingRight || 0);

    let usedHeight = 0;
    Array.from(root.children).forEach(child => {
      if (child === frame) return;
      const cs = getComputedStyle(child);
      if (cs.position === 'fixed' || cs.display === 'none') return;
      const r = child.getBoundingClientRect();
      usedHeight += r.height + parseFloat(cs.marginTop || 0) + parseFloat(cs.marginBottom || 0);
    });
    usedHeight += parseFloat(rootStyle.paddingTop || 0) + parseFloat(rootStyle.paddingBottom || 0);

    const buffer = 16; // small breathing room
    const availableHeight = Math.max(200, window.innerHeight - usedHeight - buffer);
    const availableWidth = Math.max(240, parentWidth);

    // rectangular, not forced square — a wide window gets a wide map, a tall
    // one gets a tall map. The map itself stays a square and is centered
    // (clampOrigin) with blank space on whichever axis has extra room.
    frame.style.width = availableWidth + 'px';
    frame.style.height = availableHeight + 'px';

    if (canvas) {
      const rect = canvas.getBoundingClientRect();
      const newW = Math.max(60, Math.round(rect.width));
      const newH = Math.max(60, Math.round(rect.height));
      if (newW !== viewportW || newH !== viewportH) {
        viewportW = newW;
        viewportH = newH;
        canvas.width = viewportW;
        canvas.height = viewportH;
        ctx.imageSmoothingEnabled = false;
        minZoom = Math.min(viewportW, viewportH) / TOTAL;
        zoom = Math.max(zoom, minZoom);
        rawZoom = Math.max(rawZoom, minZoom);
        clampOrigin();
      }
    }
    requestDraw();
  }

  // ---- timelapse (pixel-level history replay) ----
  async function openTimelapseModal() {
    const modal = document.getElementById('pw-timelapse-modal');
    modal.classList.remove('pw-modal-hidden');

    if (typeof window.wmapFetchLog !== 'function') {
      renderTimelapseBody('unavailable');
      return;
    }
    let events;
    try {
      events = await window.wmapFetchLog(20000);
    } catch (e) {
      renderTimelapseBody('error');
      return;
    }
    if (!events || events.length === 0) {
      renderTimelapseBody('empty');
      return;
    }
    timelapseEvents = events;
    timelapseIndex = 0;
    timelapseGrid = new Map();
    timelapsePlaying = false;
    renderTimelapseBody('player');
    timelapseCanvas = document.getElementById('pw-timelapse-canvas');
    timelapseCtx = timelapseCanvas.getContext('2d');
    timelapseCtx.imageSmoothingEnabled = false;
    drawTimelapseFrame();
  }

  function closeTimelapseModal() {
    timelapsePlaying = false;
    if (timelapseAnimHandle) cancelAnimationFrame(timelapseAnimHandle);
    document.getElementById('pw-timelapse-modal').classList.add('pw-modal-hidden');
  }

  function renderTimelapseBody(state) {
    const body = document.getElementById('pw-timelapse-body');
    if (!body) return;
    if (state === 'loading') {
      body.innerHTML = '<div class="pw-timelapse-empty">기록을 불러오는 중…</div>';

    } else if (state === 'error') {
      body.innerHTML = '<div class="pw-timelapse-empty">기록을 불러오지 못했어요.</div>';
    } else if (state === 'empty') {
      body.innerHTML = '<div class="pw-timelapse-empty">아직 기록된 픽셀이 없어요. 지금부터 그리면 여기 쌓이기 시작해요.</div>';
    } else if (state === 'player') {
      body.innerHTML = `

        </div>

          <span class="pw-timelapse-meta" id="pw-tl-gif-status"></span>
        </div>
      `;
      document.getElementById('pw-tl-play').addEventListener('click', toggleTimelapsePlay);
      document.getElementById('pw-tl-scrub').addEventListener('input', (e) => {
        timelapsePlaying = false;

      });
      document.getElementById('pw-tl-speed').addEventListener('change', (e) => {
        timelapseSpeed = parseInt(e.target.value, 10);
      });
      document.getElementById('pw-tl-gif').addEventListener('click', exportTimelapseGif);
    }
  }

  function drawTimelapseFrame() {
    if (!timelapseCtx) return;
    const scale = timelapseCanvas.width / TOTAL;
    timelapseCtx.fillStyle = '#ffffff';
    timelapseCtx.fillRect(0, 0, timelapseCanvas.width, timelapseCanvas.height);
    const s = Math.max(1, Math.ceil(scale));
    timelapseGrid.forEach((color, key) => {
      const [x, y] = key.split('_').map(Number);
      timelapseCtx.fillStyle = '#' + color;
      timelapseCtx.fillRect(Math.floor(x * scale), Math.floor(y * scale), s, s);
    });
  }

  function seekTimelapse(targetIndex) {
    targetIndex = Math.max(0, Math.min(timelapseEvents.length, targetIndex));
    if (targetIndex < timelapseIndex) {
      timelapseGrid = new Map();
      timelapseIndex = 0;
    }
    for (; timelapseIndex < targetIndex; timelapseIndex++) {
      const ev = timelapseEvents[timelapseIndex];
      timelapseGrid.set(`${ev.x}_${ev.y}`, ev.color);
    }
    drawTimelapseFrame();
    const scrub = document.getElementById('pw-tl-scrub');
    if (scrub) scrub.value = timelapseIndex;
    const meta = document.getElementById('pw-tl-meta');
    if (meta) meta.textContent = `${timelapseIndex} / ${timelapseEvents.length}개 픽셀`;
  }

  function updateTimelapsePlayLabel() {
    const btn = document.getElementById('pw-tl-play');
    if (btn) btn.textContent = timelapsePlaying ? '⏸ 일시정지' : '▶ 재생';
  }

  function toggleTimelapsePlay() {
    timelapsePlaying = !timelapsePlaying;
    updateTimelapsePlayLabel();
    if (timelapsePlaying) timelapseTick();
  }

  function timelapseTick() {
    if (!timelapsePlaying) return;
    if (timelapseIndex >= timelapseEvents.length) {
      timelapsePlaying = false;
      updateTimelapsePlayLabel();
      return;
    }
    seekTimelapse(timelapseIndex + timelapseSpeed);
    timelapseAnimHandle = requestAnimationFrame(timelapseTick);
  }

  async function ensureGifLib() {
    if (window.GIF) return;
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function exportTimelapseGif() {
    const statusEl2 = document.getElementById('pw-tl-gif-status');
    const wasPlaying = timelapsePlaying;
    timelapsePlaying = false;
    updateTimelapsePlayLabel();
    const savedIndex = timelapseIndex;
    const savedGrid = timelapseGrid;
    try {
      if (statusEl2) statusEl2.textContent = '준비 중…';
      await ensureGifLib();
      const gif = new GIF({
        workers: 2,
        quality: 10,
        width: timelapseCanvas.width,
        height: timelapseCanvas.height,
        workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
      });

      timelapseGrid = new Map();
      timelapseIndex = 0;
      const frameCount = 90;
      const step = Math.max(1, Math.ceil(timelapseEvents.length / frameCount));

      for (let i = 0; i <= timelapseEvents.length; i += step) {
        seekTimelapse(i);
        gif.addFrame(timelapseCtx, { copy: true, delay: 80 });
        if (statusEl2) statusEl2.textContent = `프레임 생성 중… ${Math.min(i, timelapseEvents.length)}/${timelapseEvents.length}`;
        await new Promise(r => setTimeout(r, 0));
      }
      seekTimelapse(timelapseEvents.length);
      gif.addFrame(timelapseCtx, { copy: true, delay: 1200 });

      gif.on('finished', (blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'wmap-timelapse.gif';
        a.click();
        if (statusEl2) statusEl2.textContent = '완료! 다운로드됨';
        timelapseGrid = savedGrid;
        timelapseIndex = savedIndex;
        drawTimelapseFrame();
        const scrub = document.getElementById('pw-tl-scrub');
        if (scrub) scrub.value = timelapseIndex;
        const meta = document.getElementById('pw-tl-meta');
        if (meta) meta.textContent = `${timelapseIndex} / ${timelapseEvents.length}개 픽셀`;
      });
      gif.render();
    } catch (e) {
      if (statusEl2) statusEl2.textContent = 'GIF 생성 실패';
      timelapseGrid = savedGrid;
      timelapseIndex = savedIndex;
      drawTimelapseFrame();
    }
  }
  function clearSelectionHighlight() { document.querySelectorAll('.pw-swatch').forEach(b => b.classList.remove('pw-selected')); }
  function syncPickerUI() {
    const colorPicker = document.getElementById('pw-color-picker');
    const hexInput = document.getElementById('pw-hex-input');
    if (colorPicker) colorPicker.value = '#' + selectedColor;
    if (hexInput) hexInput.value = '#' + selectedColor;
  }

  // ---- personal saved colors ----
  async function loadSavedColors() {
    savedColors = await getJSON('saved-colors', false, []);
    if (!Array.isArray(savedColors)) savedColors = [];
  }
  async function persistSavedColors() {
    try { await window.storage.set('saved-colors', JSON.stringify(savedColors), false); } catch (e) { /* ignore */ }
  }
  function addSavedColor(hex) {
    savedColors = savedColors.filter(c => c !== hex);
    savedColors.unshift(hex);
    if (savedColors.length > 24) savedColors = savedColors.slice(0, 24);
    persistSavedColors();
    renderSavedColors();
  }
  function removeSavedColor(hex) {
    savedColors = savedColors.filter(c => c !== hex);
    persistSavedColors();
    renderSavedColors();
  }
  function renderSavedColors() {
    const el = document.getElementById('pw-saved');
    if (!el) return;
    el.innerHTML = '';
    savedColors.forEach(hex => {
      const btn = document.createElement('button');
      btn.className = 'pw-swatch' + (hex === selectedColor ? ' pw-selected' : '');

      btn.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); removeSavedColor(hex); });
      el.appendChild(btn);
    });

    addBtn.className = 'pw-swatch pw-add-swatch';
    addBtn.textContent = '+';
    addBtn.title = '현재 색상 저장';
    addBtn.addEventListener('click', () => addSavedColor(selectedColor));
    el.appendChild(addBtn);
  }

  // ---- viewport helpers ----
  function screenToCanvasPx(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    return { sx: (clientX - rect.left) * scaleX, sy: (clientY - rect.top) * scaleY, rect, scaleX, scaleY };
  }
  function clampOrigin() {
    const viewW = viewportW / zoom, viewH = viewportH / zoom;
    originX = (viewW >= TOTAL) ? (TOTAL - viewW) / 2 : clamp(originX, 0, TOTAL - viewW);
    originY = (viewH >= TOTAL) ? (TOTAL - viewH) / 2 : clamp(originY, 0, TOTAL - viewH);
  }
  function requestDraw() {
    if (drawScheduled) return;
    drawScheduled = true;
    requestAnimationFrame(() => { drawScheduled = false; draw(); });
  }

  // ---- popups ----
  function removePopup() {
    const existing = document.getElementById('pw-popup');
    if (existing) existing.remove();
    document.removeEventListener('mousedown', onDocMouseDownDismiss, true);
  }
  function onDocMouseDownDismiss(e) {
    const popup = document.getElementById('pw-popup');
    if (popup && !popup.contains(e.target)) removePopup();
  }
  function createPopup(clientX, clientY) {
    removePopup();
    const rect = ROOT.getBoundingClientRect();
    const div = document.createElement('div');
    div.id = 'pw-popup';
    div.className = 'pw-popup';
    let left = clientX - rect.left + 8;
    let top = clientY - rect.top + 8;
    const maxLeft = rect.width - 226;
    if (left > maxLeft) left = Math.max(8, maxLeft);
    div.style.left = left + 'px';
    div.style.top = top + 'px';
    ROOT.appendChild(div);
    setTimeout(() => document.addEventListener('mousedown', onDocMouseDownDismiss, true), 0);
    return div;
  }

  function showPixelPopup(gx, gy, author, clientX, clientY) {
    const div = createPopup(clientX, clientY);
    div.innerHTML = `
      <button class="pw-popup-close" aria-label="닫기">×</button>
      <div class="pw-popup-title">픽셀 (${gx}, ${gy})</div>
      <div class="pw-popup-row">${author ? `<b>${escapeHtml(author)}</b> 님이 칠함` : '<span class="pw-popup-dim">아직 칠해지지 않음</span>'}</div>
    `;
    div.querySelector('.pw-popup-close').addEventListener('click', removePopup);
  }

  function showChunkPopup(cx, cy, clientX, clientY) {
    const k = `${cx}_${cy}`;
    const obj = chunkData.get(k);
    const name = chunkNames[k] || '';
    const counts = {};
    let painted = 0;
    if (obj) {
      obj.a.forEach(author => { if (author) { counts[author] = (counts[author] || 0) + 1; painted++; } });
    }
    const totalCells = CHUNK * CHUNK;
    const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([n, count]) => {
      const pct = Math.round((count / totalCells) * 100);
      return `<div class="pw-popup-row">${escapeHtml(n)} — ${pct}% (${count}칸)</div>`;
    }).join('') || '<div class="pw-popup-row pw-popup-dim">아직 아무도 칠하지 않음</div>';
    const blankPct = Math.round(((totalCells - painted) / totalCells) * 100);

    const div = createPopup(clientX, clientY);
    div.innerHTML = `
      <button class="pw-popup-close" aria-label="닫기">×</button>
      <div class="pw-popup-title">청크 (${cx}, ${cy})</div>
      <div class="pw-popup-rename">
        <input type="text" id="pw-popup-name-input" maxlength="24" placeholder="청크 이름 짓기" value="${escapeHtml(name)}">
        <button id="pw-popup-name-save">저장</button>
      </div>
      <div class="pw-popup-divider"></div>
      ${rows}
      ${painted < totalCells ? `<div class="pw-popup-row pw-popup-dim">빈 칸 ${blankPct}%</div>` : ''}
    `;
    div.querySelector('.pw-popup-close').addEventListener('click', removePopup);
    div.querySelector('#pw-popup-name-save').addEventListener('click', async () => {
      const val = div.querySelector('#pw-popup-name-input').value.trim().slice(0, 24);
      await renameChunk(cx, cy, val);
      removePopup();
      requestDraw();
    });
  }

  async function renameChunk(cx, cy, name) {
    try {
      const current = await getJSON(chunkNamesKey(), true, {});
      const k = `${cx}_${cy}`;
      if (name) current[k] = name; else delete current[k];
      await window.storage.set(chunkNamesKey(), JSON.stringify(current), true);
      chunkNames = current;
    } catch (e) { /* ignore */ }
  }

  async function onContextMenu(e) {
    e.preventDefault();
    const { sx, sy } = screenToCanvasPx(e.clientX, e.clientY);
    const gx = Math.floor(originX + sx / zoom), gy = Math.floor(originY + sy / zoom);
    if (gx < 0 || gy < 0 || gx >= TOTAL || gy >= TOTAL) return;
    const cx = Math.floor(gx / CHUNK), cy = Math.floor(gy / CHUNK);
    await ensureChunkLoaded(cx, cy);
    if (zoom >= PIXEL_LINE_ZOOM_THRESHOLD) {
      const obj = chunkData.get(`${cx}_${cy}`);
      const lx = gx % CHUNK, ly = gy % CHUNK;
      const idx = ly * CHUNK + lx;
      const author = obj ? obj.a[idx] : null;
      showPixelPopup(gx, gy, author, e.clientX, e.clientY);
    } else {
      showChunkPopup(cx, cy, e.clientX, e.clientY);
    }
  }

  // ---- mouse handlers ----
  function onWheel(e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const { sx, sy } = screenToCanvasPx(e.clientX, e.clientY);
      const worldX = originX + sx / zoom, worldY = originY + sy / zoom;
      const factor = Math.pow(1.0016, -e.deltaY);
      rawZoom = clamp(rawZoom * factor, minZoom, MAX_ZOOM);
      const newZoom = quantizeZoom(rawZoom);
      originX = worldX - sx / newZoom;
      originY = worldY - sy / newZoom;
      zoom = newZoom;
      clampOrigin();
      requestDraw();
      return;
    }
    if (e.shiftKey) {
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      originX += delta / zoom;
      clampOrigin();
      requestDraw();
      return;
    }
    originY += e.deltaY / zoom;
    if (e.deltaX) originX += e.deltaX / zoom;
    clampOrigin();
    requestDraw();
  }

  function onMouseDown(e) {
    removePopup();
    const { sx, sy } = screenToCanvasPx(e.clientX, e.clientY);
    if (e.button === 1 || (e.button === 0 && e.shiftKey)) {
      e.preventDefault();
      isPanning = true;
      panLast = { x: e.clientX, y: e.clientY };
      return;
    }
    if (e.button !== 0) return; // right-click handled by contextmenu
    isPointerDown = true;
    const gx = Math.floor(originX + sx / zoom), gy = Math.floor(originY + sy / zoom);
    lastPaintedWorld = { x: gx, y: gy };
    stampWorldPixel(gx, gy).then(requestDraw);
  }

  function onMouseMove(e) {
    if (isPanning) {
      const dx = e.clientX - panLast.x, dy = e.clientY - panLast.y;
      panLast = { x: e.clientX, y: e.clientY };
      originX -= dx / zoom; originY -= dy / zoom;
      clampOrigin();
      requestDraw();
      return;
    }
    if (!canvas) return;
    const { sx, sy, rect } = screenToCanvasPx(e.clientX, e.clientY);
    const gx = Math.floor(originX + sx / zoom), gy = Math.floor(originY + sy / zoom);
    if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
      coordEl.textContent = `(${gx}, ${gy}) · 청크 (${Math.floor(gx / CHUNK)}, ${Math.floor(gy / CHUNK)}) · ${Math.round(zoom * 100 / minZoom)}%`;
    }
    if (isPointerDown && mode === 'brush') {
      if (gx < 0 || gy < 0 || gx >= TOTAL || gy >= TOTAL) return;
      if (!lastPaintedWorld || lastPaintedWorld.x !== gx || lastPaintedWorld.y !== gy) {
        const from = lastPaintedWorld || { x: gx, y: gy };
        paintLine(from.x, from.y, gx, gy).then(requestDraw);
        lastPaintedWorld = { x: gx, y: gy };
      }
    }
  }

  function onMouseUp() {
    if (isPanning) { isPanning = false; return; }
    if (isPointerDown) {
      isPointerDown = false;
      lastPaintedWorld = null;
      flushDirty();
    }
  }

  // ---- touch handlers ----
  function onTouchStart(e) {
    e.preventDefault();
    removePopup();
    if (e.touches.length === 1) {
      touchMode = 'paint';
      const t = e.touches[0];
      const { sx, sy } = screenToCanvasPx(t.clientX, t.clientY);
      const gx = Math.floor(originX + sx / zoom), gy = Math.floor(originY + sy / zoom);
      lastPaintedWorld = { x: gx, y: gy };
      isPointerDown = true;
      stampWorldPixel(gx, gy).then(requestDraw);
    } else if (e.touches.length === 2) {
      touchMode = 'gesture';
      isPointerDown = false;
      const [t1, t2] = e.touches;
      touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY) || 1;
      touchStartZoom = zoom;
      touchStartRawZoom = rawZoom;
      touchStartMid = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
      touchStartOrigin = { x: originX, y: originY };
    }
  }
  function onTouchMove(e) {
    e.preventDefault();
    if (touchMode === 'paint' && e.touches.length === 1 && mode === 'brush') {
      const t = e.touches[0];
      const { sx, sy } = screenToCanvasPx(t.clientX, t.clientY);
      const gx = Math.floor(originX + sx / zoom), gy = Math.floor(originY + sy / zoom);
      if (gx < 0 || gy < 0 || gx >= TOTAL || gy >= TOTAL) return;
      if (!lastPaintedWorld || lastPaintedWorld.x !== gx || lastPaintedWorld.y !== gy) {
        const from = lastPaintedWorld || { x: gx, y: gy };
        paintLine(from.x, from.y, gx, gy).then(requestDraw);
        lastPaintedWorld = { x: gx, y: gy };
      }
    } else if (touchMode === 'gesture' && e.touches.length === 2) {
      // two-finger drag pans; pinch (distance change) also zooms
      const [t1, t2] = e.touches;
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY) || 1;
      const mid = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      rawZoom = clamp(touchStartRawZoom * (dist / touchStartDist), minZoom, MAX_ZOOM);
      const newZoom = quantizeZoom(rawZoom);
      const startCanvasX = (touchStartMid.x - rect.left) * scaleX;
      const startCanvasY = (touchStartMid.y - rect.top) * scaleX;
      const worldX = touchStartOrigin.x + startCanvasX / touchStartZoom;
      const worldY = touchStartOrigin.y + startCanvasY / touchStartZoom;
      const nowCanvasX = (mid.x - rect.left) * scaleX;
      const nowCanvasY = (mid.y - rect.top) * scaleX;
      originX = worldX - nowCanvasX / newZoom;
      originY = worldY - nowCanvasY / newZoom;
      zoom = newZoom;
      clampOrigin();
      requestDraw();
    }
  }
  function onTouchEnd(e) {
    if (touchMode === 'paint') flushDirty();
    if (e.touches.length === 0) { touchMode = null; isPointerDown = false; lastPaintedWorld = null; }
  }

  // ---- drawing ----
  function draw() {
    if (!ctx) return;
    // outside the paintable 0..TOTAL map area is black; inside it is white
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, viewportW, viewportH);
    const mapX0 = Math.round((0 - originX) * zoom);
    const mapY0 = Math.round((0 - originY) * zoom);
    const mapX1 = Math.round((TOTAL - originX) * zoom);
    const mapY1 = Math.round((TOTAL - originY) * zoom);
    ctx.fillStyle = '#' + BG_COLOR;
    ctx.fillRect(mapX0, mapY0, mapX1 - mapX0, mapY1 - mapY0);

    const viewW = viewportW / zoom, viewH = viewportH / zoom;
    const cxMin = Math.max(0, Math.floor(originX / CHUNK));
    const cxMax = Math.min(CHUNKS - 1, Math.floor((originX + viewW) / CHUNK));
    const cyMin = Math.max(0, Math.floor(originY / CHUNK));
    const cyMax = Math.min(CHUNKS - 1, Math.floor((originY + viewH) / CHUNK));
    const pixelCellPx = Math.max(1, Math.round(zoom));

    for (let cy = cyMin; cy <= cyMax; cy++) {
      for (let cx = cxMin; cx <= cxMax; cx++) {
        const k = `${cx}_${cy}`;
        if (!indexCache[k] && !chunkData.has(k)) continue;
        const obj = chunkData.get(k);
        if (!obj) { ensureChunkLoaded(cx, cy).then(requestDraw); continue; }
        for (let ly = 0; ly < CHUNK; ly++) {
          const gy = cy * CHUNK + ly;
          for (let lx = 0; lx < CHUNK; lx++) {
            const color = obj.c.substr((ly * CHUNK + lx) * 6, 6);
            if (color === BG_COLOR) continue;
            const gx = cx * CHUNK + lx;
            const x0 = Math.round((gx - originX) * zoom);
            const y0 = Math.round((gy - originY) * zoom);
            ctx.fillStyle = '#' + color;
            ctx.fillRect(x0, y0, pixelCellPx, pixelCellPx);
          }
        }
      }
    }

    // tier 3: super-chunk lines
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    const superPx = CHUNK * SUPERCHUNK;
    const sMinX = Math.floor(originX / superPx), sMaxX = Math.ceil((originX + viewW) / superPx);
    const sMinY = Math.floor(originY / superPx), sMaxY = Math.ceil((originY + viewH) / superPx);
    for (let s = sMinX; s <= sMaxX; s++) {
      const sx = (s * superPx - originX) * zoom;
      if (sx < -2 || sx > viewportW + 2) continue;
      ctx.beginPath(); ctx.moveTo(Math.round(sx) + 0.5, 0); ctx.lineTo(Math.round(sx) + 0.5, viewportH); ctx.stroke();
    }
    for (let s = sMinY; s <= sMaxY; s++) {
      const sy = (s * superPx - originY) * zoom;
      if (sy < -2 || sy > viewportH + 2) continue;
      ctx.beginPath(); ctx.moveTo(0, Math.round(sy) + 0.5); ctx.lineTo(viewportW, Math.round(sy) + 0.5); ctx.stroke();
    }

    // tier 2: chunk lines
    if (zoom >= CHUNK_LINE_ZOOM_THRESHOLD) {
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      for (let cx = cxMin; cx <= cxMax + 1; cx++) {
        const sx = (cx * CHUNK - originX) * zoom;
        if (sx < -1 || sx > viewportW + 1) continue;
        ctx.beginPath(); ctx.moveTo(Math.round(sx) + 0.5, 0); ctx.lineTo(Math.round(sx) + 0.5, viewportH); ctx.stroke();
      }
      for (let cy = cyMin; cy <= cyMax + 1; cy++) {
        const sy = (cy * CHUNK - originY) * zoom;
        if (sy < -1 || sy > viewportH + 1) continue;
        ctx.beginPath(); ctx.moveTo(0, Math.round(sy) + 0.5); ctx.lineTo(viewportW, Math.round(sy) + 0.5); ctx.stroke();
      }
    }

    // tier 1: pixel lines
    if (zoom >= PIXEL_LINE_ZOOM_THRESHOLD) {
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      const gxMin = Math.max(0, Math.floor(originX)), gxMax = Math.min(TOTAL, Math.ceil(originX + viewW));
      const gyMin = Math.max(0, Math.floor(originY)), gyMax = Math.min(TOTAL, Math.ceil(originY + viewH));
      for (let gx = gxMin; gx <= gxMax; gx++) {
        const sx = (gx - originX) * zoom;
        ctx.beginPath(); ctx.moveTo(Math.round(sx) + 0.5, 0); ctx.lineTo(Math.round(sx) + 0.5, viewportH); ctx.stroke();
      }
      for (let gy = gyMin; gy <= gyMax; gy++) {
        const sy = (gy - originY) * zoom;
        ctx.beginPath(); ctx.moveTo(0, Math.round(sy) + 0.5); ctx.lineTo(viewportW, Math.round(sy) + 0.5); ctx.stroke();
      }
    }

    // chunk name labels (only when chunks are big enough on screen)
    if (CHUNK * zoom >= CHUNK_NAME_ZOOM_MIN_PX) {
      ctx.fillStyle = 'rgba(20,20,20,0.6)';
      ctx.font = `${Math.min(13, Math.max(9, Math.floor(CHUNK * zoom * 0.13)))}px 'Courier New', monospace`;
      for (let cy = cyMin; cy <= cyMax; cy++) {
        for (let cx = cxMin; cx <= cxMax; cx++) {
          const nm = chunkNames[`${cx}_${cy}`];
          if (!nm) continue;
          const sx = (cx * CHUNK - originX) * zoom, sy = (cy * CHUNK - originY) * zoom;
          ctx.fillText(nm, sx + 4, sy + 14);
        }
      }
    }
  }

  function setStatus(text, isSyncing) {
    if (!syncDotEl) return;
    syncDotEl.title = text;
    syncDotEl.classList.toggle('pw-sync-syncing', !!isSyncing);
    syncDotEl.classList.toggle('pw-sync-error', !isSyncing && /실패/.test(text));
  }

  // ---- chunk data / storage ----
  async function ensureChunkLoaded(cx, cy) {
    const k = `${cx}_${cy}`;
    if (chunkData.has(k)) return k;
    if (indexCache[k]) {
      try {
        const result = await window.storage.get(chunkKey(cx, cy), true);
        const obj = result && result.value ? tryParseChunk(result.value) : null;
        if (obj) {
          chunkData.set(k, obj);
          chunkVersions[k] = indexCache[k];
          return k;
        }
      } catch (e) { /* fall through */ }
    }
    chunkData.set(k, defaultChunkObj());
    return k;
  }

  function getStampOffsets(radius, shape) {
    const key = shape + '_' + radius;
    if (stampOffsetsCache.has(key)) return stampOffsetsCache.get(key);
    const offsets = [];
    if (radius === 0) {
      offsets.push([0, 0]);
    } else {
      const rSq = radius * radius + radius * 0.5; // slightly generous so circles don't look too thin
      for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
          if (shape === 'circle') {
            if (dx * dx + dy * dy <= rSq) offsets.push([dx, dy]);
          } else {
            offsets.push([dx, dy]);
          }
        }
      }
    }
    stampOffsetsCache.set(key, offsets);
    return offsets;
  }

  async function stampWorldPixel(gx, gy) {
    const offsets = getStampOffsets(brushRadius, brushShape);
    for (let i = 0; i < offsets.length; i++) {
      await paintWorldPixel(gx + offsets[i][0], gy + offsets[i][1]);
    }
  }

  async function paintWorldPixel(gx, gy) {
    if (gx < 0 || gy < 0 || gx >= TOTAL || gy >= TOTAL) return;
    const cx = Math.floor(gx / CHUNK), cy = Math.floor(gy / CHUNK);
    const k = `${cx}_${cy}`;
    await ensureChunkLoaded(cx, cy);
    const lx = gx % CHUNK, ly = gy % CHUNK;
    const localIdx = ly * CHUNK + lx;
    const obj = chunkData.get(k);
    if (obj.c.substr(localIdx * 6, 6) === selectedColor) return;
    obj.c = obj.c.substring(0, localIdx * 6) + selectedColor + obj.c.substring(localIdx * 6 + 6);
    const author = selectedColor === BG_COLOR ? null : myName;
    obj.a[localIdx] = author;
    if (!pendingEdits.has(k)) pendingEdits.set(k, new Map());
    pendingEdits.get(k).set(localIdx, { color: selectedColor, author });
  }

  async function paintLine(x0, y0, x1, y1) {
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy, x = x0, y = y0, guard = 0;
    while (guard++ < 5000) {
      await stampWorldPixel(x, y);
      if (x === x1 && y === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x += sx; }
      if (e2 < dx) { err += dx; y += sy; }
    }
  }

  async function flushDirty() {
    if (pendingEdits.size === 0) return;
    const toFlush = Array.from(pendingEdits.keys());
    const snapshot = new Map();
    toFlush.forEach(k => { snapshot.set(k, pendingEdits.get(k)); pendingEdits.delete(k); });

    setStatus('전송 중…', true);
    const now = Date.now();
    const logEntries = [];
    try {
      await Promise.allSettled(toFlush.map(async (k) => {
        const edits = snapshot.get(k);
        const [cx, cy] = k.split('_').map(Number);
        let obj = defaultChunkObj();
        try {
          const result = await window.storage.get(chunkKey(cx, cy), true);
          const parsed = result && result.value ? tryParseChunk(result.value) : null;
          if (parsed) obj = parsed;
        } catch (e) { /* not created yet */ }
        edits.forEach(({ color, author }, localIdx) => {
          obj.c = obj.c.substring(0, localIdx * 6) + color + obj.c.substring(localIdx * 6 + 6);
          obj.a[localIdx] = author;
          const lx = localIdx % CHUNK, ly = Math.floor(localIdx / CHUNK);
          logEntries.push({ x: cx * CHUNK + lx, y: cy * CHUNK + ly, color, author });
        });
        await window.storage.set(chunkKey(cx, cy), JSON.stringify(obj), true);
        chunkData.set(k, obj);
        chunkVersions[k] = now;
      }));
      const index = await getJSON(chunkIndexKey(), true, {});
      toFlush.forEach(k => { index[k] = now; });
      await window.storage.set(chunkIndexKey(), JSON.stringify(index), true);
      indexCache = index;
      setStatus('동기화됨', false);
      requestDraw();
      // pixel-level history log (only present on the deployed/Supabase build, not the preview)
      if (typeof window.wmapLog === 'function' && logEntries.length > 0) {
        window.wmapLog(logEntries).catch(() => { /* logging is best-effort */ });
      }
    } catch (e) {
      setStatus('저장 실패', false);
    }
  }

  // ---- reset-all voting ----
  function isVoteExpired(state) {
    return !state.startedAt || (Date.now() - state.startedAt) > VOTE_WINDOW_MS;
  }
  function tallyVotes(state) {
    const entries = Object.values(state.votes || {});
    const yes = entries.filter(v => v === 'yes').length;
    const no = entries.filter(v => v === 'no').length;
    return { yes, no, total: yes + no };
  }
  function renderVoteUI() {
    const el = document.getElementById('pw-vote-status');
    if (el) {
      if (isVoteExpired(voteState) || Object.keys(voteState.votes || {}).length === 0) {
        el.textContent = '전체 지우기 투표 없음';
      } else {
        const { yes, no } = tallyVotes(voteState);
        const remain = Math.max(0, VOTE_WINDOW_MS - (Date.now() - voteState.startedAt));
        const h = Math.floor(remain / 3600000), m = Math.floor((remain % 3600000) / 60000);
        el.textContent = `찬성 ${yes} · 반대 ${no} (과반수 필요) · ${h}시간 ${m}분 남음`;
      }
    }
    const myVote = (!isVoteExpired(voteState) && voteState.votes) ? voteState.votes[myName] : null;
    document.querySelectorAll('.pw-vote-btn').forEach(b => b.classList.toggle('pw-active', b.dataset.vote === myVote));
  }
  async function castVote(choice) {
    try {
      let state = await getJSON(resetVoteKey(), true, { startedAt: 0, votes: {} });
      if (isVoteExpired(state)) state = { startedAt: Date.now(), votes: {} };
      if (choice === 'neutral') {
        delete state.votes[myName];
      } else {
        state.votes[myName] = choice;
      }
      await window.storage.set(resetVoteKey(), JSON.stringify(state), true);
      voteState = state;
      renderVoteUI();
      await maybeExecuteMajority();
    } catch (e) { /* ignore */ }
  }
  async function maybeExecuteMajority() {
    if (isVoteExpired(voteState)) return;
    const { yes, total } = tallyVotes(voteState);
    if (total > 0 && yes > total / 2) {
      await resetAll();
      try { await window.storage.set(resetVoteKey(), JSON.stringify({ startedAt: 0, votes: {} }), true); } catch (e) { /* ignore */ }
      voteState = { startedAt: 0, votes: {} };
      renderVoteUI();
    }
  }

  async function resetAll() {
    setStatus('초기화 중…', true);
    try {
      await window.storage.set(chunkIndexKey(), JSON.stringify({}), true);
      await window.storage.set(chunkNamesKey(), JSON.stringify({}), true);
      chunkData = new Map(); chunkVersions = {}; pendingEdits = new Map(); indexCache = {}; chunkNames = {};
      requestDraw();
      setStatus('동기화됨', false);
    } catch (e) {
      setStatus('초기화 실패', false);
    }
  }

  async function pollForUpdates() {
    if (isPointerDown || isPanning || touchMode) return;
    try {
      const newIndex = await getJSON(chunkIndexKey(), true, {});
      const changed = Object.keys(newIndex).filter(k => chunkData.has(k) && chunkVersions[k] !== newIndex[k]);
      indexCache = newIndex;
      let needsDraw = false;
      if (changed.length > 0) {
        await Promise.allSettled(changed.map(async (k) => {
          const [cx, cy] = k.split('_').map(Number);
          try {
            const result = await window.storage.get(chunkKey(cx, cy), true);
            const obj = result && result.value ? tryParseChunk(result.value) : null;
            if (obj) { chunkData.set(k, obj); chunkVersions[k] = newIndex[k]; }
          } catch (e) { /* ignore */ }
        }));
        setStatus('업데이트됨 (다른 사용자)', false);
        setTimeout(() => setStatus('동기화됨', false), 1500);
        needsDraw = true;
      }
      const newNames = await getJSON(chunkNamesKey(), true, {});
      if (JSON.stringify(newNames) !== JSON.stringify(chunkNames)) {
        chunkNames = newNames;
        needsDraw = true;
      }
      const newVoteState = await getJSON(resetVoteKey(), true, { startedAt: 0, votes: {} });
      if (JSON.stringify(newVoteState) !== JSON.stringify(voteState)) {
        voteState = newVoteState;
        await maybeExecuteMajority();
        renderVoteUI();
      } else {
        renderVoteUI(); // keeps the "N시간 남음" countdown fresh even without new votes
      }
      if (needsDraw) requestDraw();
    } catch (e) { /* ignore transient poll errors */ }
  }

  (async function init() {
    indexCache = await getJSON(chunkIndexKey(), true, {});
    chunkNames = await getJSON(chunkNamesKey(), true, {});
    voteState = await getJSON(resetVoteKey(), true, { startedAt: 0, votes: {} });
    await loadOrCreateNickname();
    await loadSavedColors();
    buildUI();
    pollTimer = setInterval(pollForUpdates, 9000);
  })();
})();

</script>
